name: Deploy web to GitHub Pages

on:
  push:
    branches:
      - main
      # Allow previewing from the feature branch before it is merged.
      - cursor/small-group-live-sessions-59da
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Automatically turn on GitHub Pages (Actions source) if it is off.
          enablement: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        # base-href must match the Pages path so assets load from
        # https://<user>.github.io/<repo>/
        run: flutter build web --release --base-href "${{ steps.pages.outputs.base_path }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
