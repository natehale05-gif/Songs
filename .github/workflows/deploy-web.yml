name: Deploy web to GitHub Pages

on:
  push:
    branches:
      - main
      # Allow previewing the active feature branch before it is merged.
      - claude/songs-app-polish-build-aplgp0
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        # base-href must match the repository name for project Pages sites.
        # build-number lands in version.json; the running app compares it with
        # APP_BUILD to notice that a newer build has been deployed.
        run: >
          flutter build web --release --base-href /Songs/
          --build-number=${{ github.run_number }}
          --dart-define=APP_BUILD=${{ github.run_number }}
          --dart-define=RELAY_URL=${{ vars.RELAY_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
