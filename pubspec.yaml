name: songs_of_the_church
description: "Songs of the Church — a cross-platform hymnal and worship set-list app built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.0
  shelf: ^1.4.2
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3
  qr_flutter: ^4.1.0
  # 7.4.0 is the floor, not just what happens to be locked: earlier releases
  # apply the Kotlin plugin in a way that breaks the Android build under
  # AGP 9, which is what the Flutter template now generates.
  mobile_scanner: ^7.4.0
  uuid: ^4.6.0
  web: ^1.1.1
  http: ^1.6.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/songs.json
