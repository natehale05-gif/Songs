name: songs_relay
description: >-
  Tiny WebSocket relay that lets Songs of the Church small-group sessions work
  over the internet, so a leader and members can be on different networks.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.12.2

dependencies:
  async: ^2.13.1
  shelf: ^1.4.2
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
