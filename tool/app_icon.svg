<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">

  <rect width="1024" height="1024" fill="#1C3975"/>

  <!-- eighth note, scaled about its own centre and placed on the canvas centre -->
